<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyDrop Autonomous Dashboard</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --card: #1f2937;
      --border: #374151;
      --accent: #38bdf8;
      --text: #f9fafb;
      --muted: #9ca3af;
      --danger: #f43f5e;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 800; font-size: 1.2rem; color: var(--accent); letter-spacing: 0.5px; }
    .badge { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }

    .container { max-width: 460px; margin: 0 auto; padding: 1rem; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    h2 { font-size: 1rem; color: var(--text); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; }
    .metric { background: var(--card); border: 1px solid var(--border); padding: 0.75rem 0.5rem; border-radius: 8px; }
    .val { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 0.9rem; }

    .btn { width: 100%; padding: 0.85rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: white; margin-top: 0.5rem; }

    #radar-screen { height: 200px; background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, rgba(17,24,39,1) 70%); border: 1px solid var(--border); border-radius: 8px; position: relative; overflow: hidden; margin-bottom: 1rem; }
    .radar-grid { position: absolute; inset: 0; border: 1px solid rgba(56,189,248,0.2); border-radius: 50%; margin: auto; width: 150px; height: 150px; }
    .drone { position: absolute; font-size: 1.5rem; transition: all 1s linear; filter: drop-shadow(0 0 6px var(--accent)); }

    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 0.6rem 0; }
    .nav-btn { background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; }
    .nav-btn.active { color: var(--accent); font-weight: bold; }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="brand">SkyDrop</div>
    <div class="badge">SYSTEM OPERATIONAL</div>
  </header>

  <div class="container">
    <!-- SCREEN 1: FLEET OVERVIEW -->
    <div id="screen-home" class="screen active">
      <div class="card">
        <h2>Fleet Overview</h2>
        <div class="grid-3">
          <div class="metric"><div class="val">12</div><div class="lbl">Active</div></div>
          <div class="metric"><div class="val">14.2 min</div><div class="lbl">Avg Time</div></div>
          <div class="metric"><div class="val">89%</div><div class="lbl">Avg Bat</div></div>
        </div>
      </div>
      <div class="card">
        <h2>Dispatch Mission</h2>
        <button class="btn btn-primary" onclick="switchScreen('screen-order')">Create Delivery Mission</button>
      </div>
    </div>

    <!-- SCREEN 2: PRE-FLIGHT CHECK -->
    <div id="screen-order" class="screen">
      <div class="card">
        <h2>Mission Payload Details</h2>
        <div class="form-group">
          <label>Delivery Target Address</label>
          <input type="text" id="dest" value="1042 Aero Way, Zone 4">
        </div>
        <div class="form-group">
          <label>Payload Weight (kg)</label>
          <input type="number" id="weight" value="4.2">
        </div>
        <button class="btn btn-primary" onclick="startDelivery()">Launch Pre-Flight Protocol</button>
      </div>
    </div>

    <!-- SCREEN 3: LIVE TRACKING -->
    <div id="screen-tracking" class="screen">
      <div class="card">
        <h2>Live Mission Telemetry</h2>
        <div class="grid-3" style="margin-bottom: 1rem;">
          <div class="metric"><div class="val" id="tel-spd">42 km/h</div><div class="lbl">Speed</div></div>
          <div class="metric"><div class="val" id="tel-alt">120 m</div><div class="lbl">Altitude</div></div>
          <div class="metric"><div class="val" id="tel-bat">76%</div><div class="lbl">Battery</div></div>
        </div>
        <div id="radar-screen">
          <div class="radar-grid"></div>
          <div id="drone" class="drone" style="top: 70%; left: 20%;">🚁</div>
        </div>
        <button class="btn btn-danger" onclick="abortFlight()">EMERGENCY ABORT MISSION</button>
      </div>
    </div>

    <!-- SCREEN 4: CONFIRMATION -->
    <div id="screen-confirm" class="screen">
      <div class="card">
        <h2>Package Arrival Verification</h2>
        <p style="font-size:0.85rem; color:var(--muted); margin-bottom:1rem;">Recipient key required to decouple payload at drop location.</p>
        <div class="form-group">
          <label>Enter Recipient Secure Key</label>
          <input type="text" id="pin" placeholder="Enter PIN">
        </div>
        <button class="btn btn-primary" onclick="completeDelivery()">Confirm Delivery & Complete</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchScreen('screen-home')">Dashboard</button>
    <button class="nav-btn" onclick="switchScreen('screen-order')">New Delivery</button>
    <button class="nav-btn" onclick="switchScreen('screen-tracking')">Tracking</button>
    <button class="nav-btn" onclick="switchScreen('screen-confirm')">Deliveries</button>
  </div>

  <script>
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    let flightInterval;
    function startDelivery() {
      switchScreen('screen-tracking');
      let drone = document.getElementById('drone');
      let top = 70;
      let left = 20;

      flightInterval = setInterval(() => {
        if (top > 25) top -= 5;
        if (left < 75) left += 6;
        drone.style.top = top + '%';
        drone.style.left = left + '%';

        if (top <= 25 && left >= 75) {
          clearInterval(flightInterval);
          setTimeout(() => { switchScreen('screen-confirm'); }, 500);
        }
      }, 1000);
    }

    function abortFlight() {
      clearInterval(flightInterval);
      alert('Mission Aborted: Drone returning to base pad.');
      switchScreen('screen-home');
    }

    function completeDelivery() {
      let pin = document.getElementById('pin').value;
      if (pin) {
        alert('Key Verified: Payload decoupled successfully.');
        switchScreen('screen-home');
      } else {
        alert('Please enter a valid recipient key.');
      }
    }
  </script>
</body>
</html>
